# Local stack: gateway + PostgreSQL + a sample internal service.
#   cp .env.example .env   # then set the passwords
#   docker compose up --build
# Panel: http://localhost:8080/_gatekeeper/   Sample route: http://localhost:8080/whoami/
services:
  gatekeeper:
    build: .
    image: security-gatekeeper:latest
    ports:
      - "${GATEKEEPER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/gatekeeper
      DATABASE_USERNAME: gatekeeper
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set GATEWAY_ADMIN_PASSWORD in .env}
      GATEWAY_NODEID: gatekeeper-1
      # Inserted once at first start; afterwards routes are managed from the panel.
      GATEWAY_ROUTES_SEED_0_PREFIX: whoami
      GATEWAY_ROUTES_SEED_0_TARGETURL: http://whoami:80
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Example internal service: not published on the host, reachable only through the gateway.
  whoami:
    image: traefik/whoami:v1.10
    restart: unless-stopped

volumes:
  db-data:
