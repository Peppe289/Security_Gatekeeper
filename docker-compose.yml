# Local stack: gateway + PostgreSQL.
#   cp .env.example .env   # then set the passwords
#   docker compose up --build
# Panel: http://localhost:8080/_gatekeeper/
services:
  gatekeeper:
    build: .
    image: security-gatekeeper:latest
    ports:
      - "${GATEKEEPER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/gatekeeper
      DATABASE_USERNAME: gatekeeper
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set GATEWAY_ADMIN_PASSWORD in .env}
      GATEWAY_AUDIT_HMAC_KEY: ${GATEWAY_AUDIT_HMAC_KEY:?set GATEWAY_AUDIT_HMAC_KEY in .env}
      # Kept outside the database. In production, prefer storage the database host cannot write to.
      GATEWAY_AUDIT_ANCHOR_DIR: /var/lib/gatekeeper/anchors
      GATEWAY_NODEID: gatekeeper-1
    volumes:
      - audit-anchors:/var/lib/gatekeeper/anchors
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

volumes:
  db-data:
  audit-anchors:
