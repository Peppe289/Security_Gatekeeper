name: Docker build

# After CI succeeds on a push to master, builds the image from the tested commit and pushes it
# to Docker Hub as :latest and :sha-<short commit>. Tagged releases still go to GHCR (release.yml).
#
# Needs the DOCKER_USERNAME and DOCKER_PASSWORD secrets (the password should be a Docker Hub
# personal access token with read & write scope). Without them the push is skipped, not failed.
# The repository defaults to peppe289/security_gatekeeper; set the DOCKERHUB_IMAGE variable to change it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'peppe289/security_gatekeeper' }}

jobs:
  push:
    name: Build and push to Docker Hub
    # Only pushes to master, never pull requests (workflow_run would also fire for those).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKER_USERNAME / DOCKER_PASSWORD not set: skipping the Docker Hub push."
          fi

      # The commit CI tested, not the current head of master.
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4
        if: steps.creds.outputs.present

      - uses: docker/login-action@v4
        if: steps.creds.outputs.present
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tags
        id: tags
        if: steps.creds.outputs.present
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.creds.outputs.present
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.creds.outputs.present
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          echo "### Pushed to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
