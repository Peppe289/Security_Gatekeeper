name: OpenJML

# Checks the JML specifications of the pure-Java core package (both steps are blocking):
#   - type check (-check): JML syntax and typing;
#   - static verification (-esc): proves every method against its specification.
# Methods whose bodies depend on JDK classes without usable JML specifications
# (MessageDigest, URI, StringBuilder) are marked `skipesc` in the source; their
# specifications are still used to verify their callers, and the unit tests cover them.

on:
  push:
    branches: [master]
    paths:
      - 'src/main/java/io/github/peppe289/security_gatekeeper/core/**'
      - '.github/workflows/openjml.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/main/java/io/github/peppe289/security_gatekeeper/core/**'
      - '.github/workflows/openjml.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENJML_VERSION: '21.0.29'
  CORE_DIR: src/main/java/io/github/peppe289/security_gatekeeper/core

jobs:
  openjml:
    name: JML specifications (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache OpenJML
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/openjml
          key: openjml-${{ env.OPENJML_VERSION }}

      - name: Install OpenJML
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/openjml.zip \
            "https://github.com/OpenJML/OpenJML/releases/download/${OPENJML_VERSION}/openjml-ubuntu-24.04-${OPENJML_VERSION}.zip"
          mkdir -p ~/openjml
          unzip -q /tmp/openjml.zip -d ~/openjml

      - name: Core sources
        run: find "$CORE_DIR" -name '*.java' | sort | tee /tmp/core-sources.txt

      # No --release flag: OpenJML ships JML specs for the JDK it is built on (21), and
      # targeting an older platform makes those specs fail to load. core is plain
      # Java 17 code, which compiles unchanged on 21.
      - name: Type check
        run: ~/openjml/openjml -check @/tmp/core-sources.txt

      - name: Static verification
        run: |
          set -o pipefail
          ~/openjml/openjml -esc -progress @/tmp/core-sources.txt 2>&1 | tee /tmp/esc.log

      - name: Verification summary
        if: ${{ always() }}
        run: |
          [ -f /tmp/esc.log ] || exit 0
          {
            echo "### OpenJML static verification"
            echo
            echo "- proved without warnings: $(grep -c 'no warnings' /tmp/esc.log)"
            echo "- with warnings or timeouts: $(grep -E '^Completed proof' /tmp/esc.log | grep -vc 'no warnings')"
            echo
            echo '<details><summary>Warnings</summary>'
            echo
            echo '```'
            grep -A2 -E 'verify:|warning:' /tmp/esc.log | head -n 200
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
