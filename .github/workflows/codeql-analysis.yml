name: CodeQL

# Static analysis of the Java code with CodeQL (`security-and-quality` queries). Results go to
# Security > Code scanning; the job fails while a High or Critical security alert, or an
# error-level finding, is open on the analysed ref.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 5 * * 1'   # weekly: new CodeQL queries can flag code that did not change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
      actions: read            # read the workflow run, needed by the upload
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # Production code only: test code is not shipped and would add noise to the results.
      - name: Build
        run: ./mvnw -B -ntp -DskipTests compile

      # Waits until GitHub has processed the results (wait-for-processing defaults to true),
      # so the alerts of this commit can be queried right after.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

      # Quality gate on the open alerts of this ref, so a dismissal with a written reason
      # (Security > Code scanning) is respected. Blocking: High or Critical security alerts
      # (security-severity >= 7.0) and error-level findings.
      - name: Quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
        run: |
          gh api --paginate "repos/$REPOSITORY/code-scanning/alerts?state=open&ref=$REF&per_page=100" \
            --jq '.[] | [(if (.rule.security_severity_level == "high" or .rule.security_severity_level == "critical" or .rule.severity == "error") then "❌" else "⚠️" end),
                         .rule.id, (.rule.security_severity_level // "-"), .rule.severity,
                         "\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)", .html_url] | @tsv' > alerts.tsv
          total=$(grep -c . alerts.tsv || true)
          blocking=$(grep -c '^❌' alerts.tsv || true)
          {
            echo "### CodeQL: $total open alert(s), $blocking blocking"
            if [ "$total" -gt 0 ]; then
              echo
              echo "| | Rule | Security severity | Level | Location | Alert |"
              echo "|---|---|---|---|---|---|"
              awk -F'\t' '{ printf "| %s | `%s` | %s | %s | `%s` | [link](%s) |\n", $1, $2, $3, $4, $5, $6 }' alerts.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$blocking" -eq 0 ]
