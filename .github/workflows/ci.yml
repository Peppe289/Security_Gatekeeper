name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # test report on the commit / pull request
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit + integration tests (Testcontainers uses the runner's Docker),
      # JaCoCo report and coverage gate on the core package.
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        with:
          name: Test results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/jacoco.csv') != '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          def pct(rs, k):
              m = sum(int(r[k + '_MISSED']) for r in rs)
              c = sum(int(r[k + '_COVERED']) for r in rs)
              return f"{100 * c / (m + c):.1f}%" if m + c else "n/a"
          core = [r for r in rows if '.core' in r['PACKAGE']]
          print("### Coverage (JaCoCo)\n")
          print("| Scope | Lines | Branches |\n|---|---|---|")
          print(f"| core (gate: 85%) | {pct(core, 'LINE')} | {pct(core, 'BRANCH')} |")
          print(f"| whole project | {pct(rows, 'LINE')} | {pct(rows, 'BRANCH')} |")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: security-gatekeeper-jar
          path: target/security_gatekeeper-*.jar
          retention-days: 14

  mutation:
    name: Mutation testing (PiTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Fails the build below the threshold set in pom.xml (pitest.mutation.threshold).
      - name: PiTest on the core package
        run: ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Mutation summary
        if: ${{ !cancelled() && hashFiles('target/pit-reports/mutations.xml') != '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from collections import Counter
          muts = list(ET.parse('target/pit-reports/mutations.xml').getroot())
          status = Counter(m.get('status') for m in muts)
          total = len(muts)
          print("### Mutation testing (PiTest)\n")
          print(f"**{status['KILLED']}/{total} mutants killed** "
                f"({100 * status['KILLED'] / total:.1f}%)\n" if total else "No mutants generated\n")
          for m in muts:
              if m.get('status') != 'KILLED':
                  cls = m.findtext('mutatedClass').rsplit('.', 1)[-1]
                  print(f"- {m.get('status')}: `{cls}.{m.findtext('mutatedMethod')}` "
                        f"line {m.findtext('lineNumber')}: {m.findtext('description')}")
          EOF

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pitest-report
          path: target/pit-reports/
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Checks that the multi-stage Dockerfile builds; publishing happens in release.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: security-gatekeeper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
