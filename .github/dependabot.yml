version: 2
# Review requests come from .github/CODEOWNERS (Dependabot's own `reviewers` option is
# deprecated); `assignees` makes each update show up in the maintainer's queue.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    assignees: [Peppe289]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees: [Peppe289]
    ignore:
      # The JDK major is set in pom.xml and the workflows too: bump it by hand, everywhere at once.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [Peppe289]
    groups:
      actions:
        patterns: ['*']
