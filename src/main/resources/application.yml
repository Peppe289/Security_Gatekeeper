spring:
  application:
    name: security-gatekeeper
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gatekeeper}
    username: ${DATABASE_USERNAME:gatekeeper}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
  mvc:
    # The proxy must see raw request bodies: never let Spring parse form bodies.
    formcontent:
      filter:
        enabled: false
    problemdetails:
      enabled: true
    # Panel assets live under the admin path, so they never collide with a route prefix.
    static-path-pattern: /_gatekeeper/assets/**
  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # TLS termination on the gateway itself (optional): set SERVER_SSL_ENABLED=true,
  # SERVER_SSL_CERTIFICATE / SERVER_SSL_CERTIFICATE_PRIVATE_KEY (PEM) or a keystore.
  # Behind another TLS terminator / load balancer use SERVER_FORWARD_HEADERS_STRATEGY=native.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    path: /_gatekeeper/error
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: GKSESSION
        # Never sent to proxied routes.
        path: /_gatekeeper
        http-only: true
        same-site: strict
        secure: ${GATEWAY_SECURE_COOKIE:false}
  tomcat:
    # Proxied uploads are streamed; this only bounds bodies the server must read itself (e.g. the login form).
    max-http-form-post-size: 64KB

management:
  endpoints:
    web:
      base-path: /_gatekeeper
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

gateway:
  node-id: ${HOSTNAME:node-1}
  api-key-header: X-Api-Key
  admin:
    username: admin
    # Empty: a random password is generated and logged at startup. Set GATEWAY_ADMIN_PASSWORD.
    password: ${GATEWAY_ADMIN_PASSWORD:}
  forwarder:
    connect-timeout: 5s
    response-timeout: 60s
  routes:
    refresh-interval: 10s
  rate-limit:
    default-burst-capacity: 100
    default-refill-per-second: 50
    max-tracked-clients: 100000
    eviction-interval: 60s
  login-throttle:
    max-failures: 5
    recovery: 30s
  audit:
    queue-capacity: 50000
    batch-size: 500
    flush-interval: 500ms
  dashboard:
    stats-refresh: 5s
    verify-cooldown: 30s
    recent-audit-rows: 50

logging:
  level:
    root: INFO
